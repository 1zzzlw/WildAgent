# 知识库路径级 metadata 默认值。
# 合并顺序：defaults → 按书写顺序命中的 mapping_rules → Markdown 文件头。
# 因此更具体的规则要写在更靠后的位置，文件头可覆盖任何默认值。
# path_pattern 使用相对路径：* 匹配一层，** 用于递归子目录。
version: 2

# 生产镜像完整性清单。新增、移动或删除活动文档时必须同步更新；部署门禁检查
# 每个条目真实存在，知识库质量仍由 rules-v3 linter 检查。
required_documents:
  - BLUEPRINT-PATCH-PROTOCOL.md
  - BLUEPRINT-SPEC-FULL.md
  - BLUEPRINT-SPEC-MINIMAL.md
  - components/README.md
  - components/composite-components-second-batch.md
  - components/doors-supported.md
  - components/doors.md
  - components/engine-capability-boundaries.md
  - components/glass-curtain-walls.md
  - components/light.md
  - components/railings.md
  - components/roofs-and-eaves.md
  - components/stair.md
  - components/structural-components.md
  - components/walls.md
  - components/windows-supported.md
  - components/windows.md
  - recipes/README.md
  - recipes/component-selection-relations.md
  - recipes/glass-curtain-wall-assembly.md
  - recipes/material-role-relations.md
  - recipes/supported-assembly-relations.md
  - README.md

defaults:
  knowledge_revision: rules-v3
  knowledge_role: capability
  wild_version: "1.1"
  # 当前仓库知识默认公开；未来受限文档必须在文件头显式覆盖，并补 tenant/department。
  access_scope: public

mapping_rules:
  - path_pattern: "BLUEPRINT-SPEC-*.md"
    metadata:
      doc_type: blueprint_spec
      knowledge_role: protocol
      doc_scope: generation
      knowledge_layer: wild_schema
      entity_type: schema

  - path_pattern: "BLUEPRINT-SPEC-MINIMAL.md"
    metadata:
      doc_scope: system

  - path_pattern: "BLUEPRINT-PATCH-PROTOCOL.md"
    metadata:
      doc_type: blueprint_spec
      knowledge_role: protocol
      doc_scope: generation
      knowledge_layer: wild_schema
      entity_type: schema

  - path_pattern: "components/*.md"
    metadata:
      doc_type: component
      doc_scope: generation
      knowledge_layer: wild_schema

  - path_pattern: "recipes/*.md"
    metadata:
      doc_type: recipe
      knowledge_role: relation
      doc_scope: generation
      knowledge_layer: constraint

  # README 和目录型文档必须放在普通目录规则之后，以覆盖生成类默认值。
  - path_pattern: "README.md"
    metadata:
      doc_type: index
      knowledge_role: navigation
      doc_scope: index
      knowledge_layer: navigation
      entity_type: index
      topic: navigation

  - path_pattern: "*/README.md"
    metadata:
      doc_type: index
      knowledge_role: navigation
      doc_scope: index
      knowledge_layer: navigation
      entity_type: index
      topic: navigation
