[project]
name = "wild-server"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.1.0",
    "fastapi[standard]>=0.139.2",
    "geoip2>=5.3.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.0",
    "langchain-openai>=1.4.0",
    "langchain-text-splitters>=1.1.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "loguru>=0.7.3",
    "openai>=2.0.0",
    "httpx>=0.28.1",
    "jsonschema>=4.25.1",
    "sqlalchemy>=2.0,<3",
    "pymysql[rsa]>=1.2.4,<2",
    "redis>=5,<8",
    "langgraph-checkpoint-mysql[asyncmy]>=3,<4",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2,<3",
    "langgraph-api>=0.11.0",
    "langgraph-cli[inmem]",
    "langsmith>=0.10.9",
    "pytest>=8,<10",
    "python-dotenv>=1.2.2",
]

[tool.fastapi]
entrypoint = "main:app"
