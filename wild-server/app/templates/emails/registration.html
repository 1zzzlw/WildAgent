<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WILD · 邮箱验证</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f4ee;color:#202e2a;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;">完成邮箱验证，开启你的建筑创作。验证码在 ${validity}内有效。</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#f5f4ee;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <!--[if mso]><table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;background-color:#fffefa;border:1px solid #d7dcd2;border-radius:16px;">
          <tr>
            <td style="padding:32px 28px 24px;border-bottom:1px solid #e6ebe1;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td width="48" style="width:48px;vertical-align:middle;">
                    <img src="cid:wild-logo" width="40" height="40" alt="WILD" style="display:block;width:40px;height:40px;border:0;outline:none;text-decoration:none;">
                  </td>
                  <td style="padding-left:8px;vertical-align:middle;">
                    <p style="margin:0;color:#294c3d;font-size:22px;font-weight:700;line-height:28px;letter-spacing:4px;">WILD</p>
                    <p style="margin:3px 0 0;color:#64736c;font-size:12px;line-height:20px;letter-spacing:1px;">建筑蓝图工作台</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px 28px;">
              <h1 style="margin:0 0 16px;color:#202e2a;font-size:26px;font-weight:600;line-height:36px;">验证你的邮箱</h1>
              <p style="margin:0 0 24px;color:#64736c;font-size:14px;line-height:26px;">欢迎加入 WILD。请回到注册页面，输入下方验证码，完成邮箱验证。</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#eef3e9;border:1px solid #c5d2be;border-radius:10px;">
                <tr>
                  <td align="center" style="padding:20px 12px 22px;">
                    <p style="margin:0 0 8px;color:#64736c;font-size:12px;line-height:20px;">本次注册验证码</p>
                    <p style="margin:0;color:#294c3d;font-family:Consolas,Menlo,monospace;font-size:34px;font-weight:700;line-height:48px;letter-spacing:6px;">$code</p>
                  </td>
                </tr>
              </table>
              <p style="margin:18px 0 0;color:#475b50;font-size:13px;line-height:24px;">验证码在 <strong style="color:#294c3d;">$validity</strong>内有效，请勿向任何人透露。</p>
              <p style="margin:24px 0 0;padding-top:20px;border-top:1px solid #e6ebe1;color:#64736c;font-size:12px;line-height:22px;">如果这不是你的操作，请忽略此邮件。此邮件由系统自动发送，无需回复。</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
        <p style="margin:20px 0 0;color:#64736c;font-size:12px;line-height:22px;">WILD · 让想法成为空间</p>
      </td>
    </tr>
  </table>
</body>
</html>
