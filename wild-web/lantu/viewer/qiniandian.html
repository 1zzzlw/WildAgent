<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>祈年殿 · WILD 蓝图渲染</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: rgba(18, 22, 29, 0.82);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #e6e9ef;
        --muted: #8b95a5;
        --accent: #c9a24b;
        --ok: #5fd38a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      #overlay {
        position: absolute; top: 20px; left: 20px; width: 300px;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 14px; padding: 18px 18px 16px;
        backdrop-filter: blur(14px) saturate(140%);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #overlay h1 {
        font-size: 17px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.02em;
      }
      #overlay .sub {
        font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 12px;
      }
      #overlay .sub .accent { color: var(--accent); }
      #stats { font-size: 12px; line-height: 1.9; }
      #stats .k { color: var(--muted); }
      #stats .v { color: var(--text); font-variant-numeric: tabular-nums; }

      #pill {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; margin-top: 12px; padding: 3px 9px; border-radius: 999px;
        color: var(--ok); background: rgba(95, 211, 138, 0.1);
        border: 1px solid rgba(95, 211, 138, 0.24);
      }

      #hint {
        position: absolute; bottom: 16px; left: 20px; font-size: 11.5px;
        color: var(--muted); background: var(--panel);
        border: 1px solid var(--border); padding: 7px 12px;
        border-radius: 9px; backdrop-filter: blur(14px);
      }
      #hint kbd {
        font-family: inherit; color: var(--text); background: rgba(255,255,255,0.07);
        border-radius: 4px; padding: 1px 5px; margin: 0 1px;
      }
      #loading {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 13px; color: var(--muted); pointer-events: none;
      }
    </style>

    <title>祈年殿 · WILD 蓝图渲染</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: rgba(18, 22, 29, 0.82);
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #e6e9ef;
        --muted: #8b95a5;
        --accent: #c9a24b;
        --ok: #5fd38a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      #overlay {
        position: absolute; top: 20px; left: 20px; width: 300px;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 14px; padding: 18px 18px 16px;
        backdrop-filter: blur(14px) saturate(140%);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #overlay h1 {
        font-size: 17px; font-weight: 600; margin: 0 0 4px; letter-spacing: 0.02em;
      }
      #overlay .sub {
        font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 12px;
      }
      #overlay .sub .accent { color: var(--accent); }
      #stats { font-size: 12px; line-height: 1.9; }
      #stats .k { color: var(--muted); }
      #stats .v { color: var(--text); font-variant-numeric: tabular-nums; }

      #pill {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; margin-top: 12px; padding: 3px 9px; border-radius: 999px;
        color: var(--ok); background: rgba(95, 211, 138, 0.1);
        border: 1px solid rgba(95, 211, 138, 0.24);
      }

      #hint {
        position: absolute; bottom: 16px; left: 20px; font-size: 11.5px;
        color: var(--muted); background: var(--panel);
        border: 1px solid var(--border); padding: 7px 12px;
        border-radius: 9px; backdrop-filter: blur(14px);
      }
      #hint kbd {
        font-family: inherit; color: var(--text); background: rgba(255,255,255,0.07);
        border-radius: 4px; padding: 1px 5px; margin: 0 1px;
      }
      #loading {
        position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 13px; color: var(--muted); pointer-events: none;
      }
