<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WILD 蓝图渲染查看器</title>
    <style>
      :root {
        --bg: #0e1116;
        --panel: rgba(18, 22, 29, 0.88);
        --panel-solid: #12161d;
        --border: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.14);
        --text: #e6e9ef;
        --muted: #8b95a5;
        --accent: #5b9dff;
        --ok: #5fd38a;
        --warn: #f2c14e;
        --err: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      #panel {
        position: absolute; top: 18px; left: 18px; width: 348px;
        max-height: calc(100% - 36px); overflow-y: auto;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 14px; padding: 18px 18px 14px;
        backdrop-filter: blur(14px) saturate(140%);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      }
      #panel::-webkit-scrollbar { width: 8px; }
      #panel::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.12); border-radius: 4px;
      }

      .head { margin-bottom: 16px; }
      .head h1 {
        font-size: 15px; font-weight: 600; margin: 0 0 6px;
        letter-spacing: 0.02em;
      }
      .badge {
        display: inline-block; font-size: 10px; letter-spacing: 0.04em;
        color: var(--accent); background: rgba(91, 157, 255, 0.12);
        border: 1px solid rgba(91, 157, 255, 0.28);
        padding: 2px 7px; border-radius: 999px;
      }

      .field { margin-bottom: 14px; }
      .field > label {
        display: block; font-size: 11px; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
      }
      select, input[type="file"], input[type="range"] {
        width: 100%; padding: 8px 10px; border-radius: 9px;
        border: 1px solid var(--border-strong); background: #0b0e13;
        color: var(--text); font-size: 13px; font-family: inherit;
        transition: border-color 0.15s;
      }
      select:hover, input[type="file"]:hover { border-color: rgba(255,255,255,0.24); }
      select:focus, input[type="file"]:focus, input[type="range"]:focus {
        outline: none; border-color: var(--accent);
      }
      input[type="file"] { font-size: 12px; padding: 6px 8px; }
      input[type="file"]::file-selector-button {
        background: #1c2230; color: var(--text); border: 1px solid var(--border-strong);
        border-radius: 6px; padding: 4px 9px; margin-right: 9px;
        font-size: 12px; font-family: inherit; cursor: pointer;
      }
      input[type="range"] {
        padding: 0; height: 22px; background: transparent; border: none;
        accent-color: var(--accent); cursor: pointer;
      }

      .section {
        border-top: 1px solid var(--border); padding-top: 12px; margin-top: 14px;
      }
      .section-title {
        font-size: 11px; color: var(--muted); text-transform: uppercase;
        letter-spacing: 0.06em; margin-bottom: 9px;
      }

      #stats { font-size: 12px; line-height: 1.85; }
      #stats .k { color: var(--muted); }
      #stats .v { color: var(--text); }
      #stats .v.mono { font-variant-numeric: tabular-nums; }

      .pill {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; padding: 2px 8px; border-radius: 999px;
        border: 1px solid transparent;
      }
      .pill.ok { color: var(--ok); background: rgba(95, 211, 138, 0.1);
        border-color: rgba(95, 211, 138, 0.24); }
      .pill.warn { color: var(--warn); background: rgba(242, 193, 78, 0.1);
        border-color: rgba(242, 193, 78, 0.24); }
      .pill.err { color: var(--err); background: rgba(255, 107, 107, 0.1);
        border-color: rgba(255, 107, 107, 0.26); }

      details { margin-top: 10px; }
      details > summary {
        font-size: 12px; color: var(--muted); cursor: pointer;
        list-style: none; user-select: none;
      }
      details > summary::-webkit-details-marker { display: none; }
      details > summary::before { content: "▸ "; }
      details[open] > summary::before { content: "▾ "; }
      details > summary:hover { color: var(--text); }
      .diag-list {
        margin: 8px 0 0; padding: 0; list-style: none;
        max-height: 240px; overflow-y: auto; font-size: 11px; line-height: 1.6;
      }
      .diag-list li {
        padding: 6px 8px; border-radius: 6px; margin-bottom: 5px;
        background: rgba(255,255,255,0.03); word-break: break-word;
      }
      .diag-list li.err { border-left: 2px solid var(--err); }
      .diag-list li.warn { border-left: 2px solid var(--warn); }
      .diag-list .diag-el {
        color: var(--accent); font-family: ui-monospace, Consolas, monospace;
        font-size: 10px; display: block; margin-bottom: 2px;
      }

      .controls { display: flex; flex-wrap: wrap; gap: 9px 16px; }
      .controls label {
        display: flex; align-items: center; gap: 6px; font-size: 12px;
        color: var(--text); cursor: pointer; user-select: none;
      }
      .controls input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

      .triage {
        font-size: 11px; line-height: 1.7; color: var(--muted);
        background: rgba(91,157,255,0.06); border: 1px solid rgba(91,157,255,0.18);
        border-radius: 9px; padding: 9px 11px;
      }
      .triage b { color: var(--text); font-weight: 600; }

      #hint {
        position: absolute; bottom: 16px; left: 18px; font-size: 11.5px;
        color: var(--muted); background: var(--panel);
        border: 1px solid var(--border); padding: 7px 12px;
        border-radius: 9px; backdrop-filter: blur(14px);
      }
      #hint kbd {
        font-family: inherit; color: var(--text); background: rgba(255,255,255,0.07);
        border-radius: 4px; padding: 1px 5px; margin: 0 1px;
      }
      #empty-state {
        position: absolute; inset: 0; display: none; place-items: center;
        font-size: 13px; color: var(--muted);
      }
    </style>

  <body>
    <div id="app"></div>

    <div id="panel">
      <div class="head">
        <h1>WILD 蓝图渲染查看器</h1>
        <span class="badge">wild-core → compiler → renderEntity</span>
      </div>

      <div class="field" id="bpField">
        <label for="bp">选择蓝图</label>
        <select id="bp"></select>
      </div>

      <div class="field">
        <label for="file">或加载本地 .wild</label>
        <input id="file" type="file" accept=".wild,application/json" />
      </div>

      <div class="section">
        <div class="section-title">场景信息</div>
        <div id="stats"></div>
      </div>

      <div class="section">
        <div class="section-title">显示</div>
        <div class="controls">
          <label><input id="spin" type="checkbox" /> 自动旋转</label>
          <label><input id="wire" type="checkbox" /> 线框</label>
          <label><input id="gridToggle" type="checkbox" checked /> 网格地面</label>
          <label><input id="bbox" type="checkbox" /> 构件包围盒</label>
        </div>
        <div class="field" style="margin: 12px 0 0">
          <label for="exposure">曝光 <span id="exposureVal" class="v mono">1.05</span></label>
          <input id="exposure" type="range" min="0.4" max="2.2" step="0.05" value="1.05" />
        </div>
        <div class="field" style="margin: 12px 0 0">
          <label for="level">楼层隔离</label>
          <select id="level"></select>
        </div>
      </div>

      <div class="section">
        <div class="section-title">分诊</div>
        <div class="triage">
          看走样先判<b>数据还是引擎</b>：<br />
          ① 悬空 / 穿透 / 位置离谱 → <b>蓝图</b>问题<br />
          ② 数据对但材质、光影、面朝向怪 → <b>引擎</b>问题<br />
          打开「构件包围盒」，位置错一眼可见。
        </div>
      </div>
    </div>

    <div id="hint">
      <kbd>左键</kbd> 旋转 · <kbd>右键</kbd> 平移 · <kbd>滚轮</kbd> 缩放
    </div>

  </body>
</html>
