import * as THREE from 'three';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { reconstructEntity } from '/@fs/E:/AgentProject/WildAgent/wild-core/src/primitive/index.ts';
import { createSceneGroupFromEntity } from '/src/renderer/renderEntity.ts';
import { setWaterSurfaceTime,setWaterSurfaceAnimated } from '/src/renderer/waterSurfaceMaterial.ts';
const elements=[{type:'floor',id:'base',from:[-4,-.2,-3],to:[4,-.2,3],thickness:.2,material:'stone'}, {type:'floor',id:'pool-bottom',from:[-3,-.03,-2],to:[3,-.03,2],thickness:.1,material:'tile'}, {type:'floor',id:'water',from:[-3,.16,-2],to:[3,.16,2],thickness:.03,material:'water'}];
