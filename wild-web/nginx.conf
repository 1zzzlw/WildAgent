# 域名 + IP 双入口，纯 HTTP（未启用 SSL）。
#访问方式：
#   - http://www.zzzlew.asia（域名）
#   - http://121.41.78.197（IP 兜底，保留是为了排障时域名异常还能进）
#
# 三个必须点：
#   1. listen 80 必须带 default_server 且 server_name 结尾带 _：用 IP 访问时
#      Host 头不等于任何域名，只有 default_server 会接住；纯 IP 场景下
#      配成 return 444 会表现为"打不开"。
#   2. domain 写在 default_server 前面、_ 兜底在最后：域名进来时 Host 头
#      能对上，反代给后端的 Host / X-Forwarded-Proto 才是对的。
#   3. **不要加任何 ssl_certificate 指令**：容器内没有 /etc/letsencrypt，
#      nginx 会因加载证书失败而启动失败，导致部署回滚。启用 SSL 时需同步
#      改 Jenkinsfile 挂载证书卷、改这里的 server 块结构，参考
#      docs/operations/HTTPS_SETUP.md。
server {
    listen 80 default_server;
    server_name www.zzzlew.asia 121.41.78.197 _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws/ {
        proxy_pass http://wild-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://wild-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
