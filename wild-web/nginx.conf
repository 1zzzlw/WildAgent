# HTTPS 入口 + IP / 非本站域名拦截
#
# 访问方式：
#   - https://www.zzzlew.asia（唯一有效入口）
#   - http://121.41.78.197 → 444 断连（排障请用 ssh 隧道，不要靠 IP 直连）
#
# ⚠️ 证书只签了 www.zzzlew.asia，**裸域 zzzlew.asia 不在证书内**，
#    浏览器会报证书错误，所以 server_name 里不写裸域。
#    要支持裸域需三步：
#      ① 阿里云加 zzzlew.asia 的 A 记录 → 121.41.78.197
#      ② 重新签发含裸域的证书：certonly -d zzzlew.asia -d www.zzzlew.asia
#      ③ 下面两个业务 server 块的 server_name 各加一个 zzzlew.asia
#
# 四个 server 块的分工（顺序有意义，default_server 必须最先匹配）：
#   1. 80 default_server  → 444：拦 IP 直连与非本站域名
#   2. 443 default_server → 444：同上，SSL 层拦截
#   3. 80 业务域名         → 301 跳 https，并放行 ACME challenge（续期必需）
#   4. 443 业务域名       → 静态文件 + /api /ws 反代
#
# 部署前置条件（缺任一项 wild-web 容器启动失败 → Jenkins 回滚）：
#   - Jenkinsfile 的 start_web() 必须挂载这两个卷（与下面的路径硬绑定）：
#       /opt/wild-agent/certbot/letsencrypt:/etc/letsencrypt:ro
#       /opt/wild-agent/certbot/www:/var/www/certbot:ro
#   - 证书须存在于 /opt/wild-agent/certbot/letsencrypt/live/www.zzzlew.asia/
#   - Dockerfile 已 EXPOSE 443
# 参考 docs/operations/HTTPS_SETUP.md

# ---- 1. 拦截 IP 直访问和非本站域名 ----
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/www.zzzlew.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zzzlew.asia/privkey.pem;
    return 444;
}

# ---- 2. HTTP → HTTPS 重定向，保留 ACME challenge ----
server {
    listen 80;
    server_name www.zzzlew.asia;

    # certbot webroot 续期要能访问这个路径，**不能**跟着 301 走。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 3. HTTPS 业务 ----
server {
    listen 443 ssl http2;
    server_name www.zzzlew.asia;

    ssl_certificate     /etc/letsencrypt/live/www.zzzlew.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zzzlew.asia/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location / {
        # Vue 路由可能与静态资源目录同名，只匹配文件，未命中时回退到前端入口。
        try_files $uri /index.html;
    }

    location /ws/ {
        proxy_pass http://wild-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://wild-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
