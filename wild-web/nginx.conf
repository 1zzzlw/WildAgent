# 无域名部署：通过 IP + HTTP 直接访问（http://121.41.78.197）。
#
# 旧配置（域名 www.zzzlew.asia + Let's Encrypt 443 + HTTP→HTTPS 跳转）已备份为
# wild-web/nginx.conf-temp。
#
# 两个必须点：
#   1. listen 80 必须带 default_server 且 server_name 为 _：用 IP 访问时 Host 头
#      不等于任何域名，只有 default_server 会接住；旧配置的 default_server 是
#      return 444（直接断连），所以 IP 访问会表现为"打不开"。
#   2. 不要保留任何 ssl_certificate 指令：容器内没有 /etc/letsencrypt，
#      nginx 会因加载证书失败而启动失败，导致部署回滚。
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /ws/ {
        proxy_pass http://wild-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://wild-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
