services:
  server:
    build: ./wild-server
    ports:
      - "8000:8000"
    volumes:
      - ./wild-server/storage:/app/storage
      - ./wild-server/.env:/app/runtime-config/.env
    env_file:
      - ./wild-server/.env
    environment:
      WILD_RUNTIME_ENV_FILE: /app/runtime-config/.env
      WILD_RUNTIME_ENV_PERSISTENT: "true"
      WILD_RUNTIME_ENV_HOST_PATH: ./wild-server/.env
    networks:
      default:
        aliases:
          # nginx.conf 同时兼容 Compose 与旧版手工 docker run 部署。
          - wild-server
    restart: unless-stopped

  web:
    build: ./wild-web
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
