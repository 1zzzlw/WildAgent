stages:
  - deploy

variables:
  DEPLOY_SSH_USER: "root"
  DEPLOY_SSH_HOST: "39.106.183.13"
  DEPLOY_SSH_PORT: "22"
  DEPLOY_BASE_DIR: "/opt/wild-agent"
  DEPLOY_DATA_DIR: "/opt/wild-agent/storage"
  PYTHON_BASE_IMAGE: "python:3.12-slim"
  NODE_BASE_IMAGE: "node:22-alpine"
  NGINX_BASE_IMAGE: "nginx:alpine"
  UV_BASE_IMAGE: "ghcr.io/astral-sh/uv:latest"

deploy-production:
  stage: deploy
  image: alpine:3.20
  resource_group: production
  before_script:
    - apk add --no-cache openssh-client tar gzip
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "ERROR - set SSH_PRIVATE_KEY in GitLab CI/CD variables"
        exit 1
      fi
    - |
      if [ -z "$DEPLOY_SSH_HOST" ]; then
        echo "ERROR - set DEPLOY_SSH_HOST in GitLab CI/CD variables"
        exit 1
      fi
    - mkdir -p ~/.ssh
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
      fi
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - DEPLOY_TARGET="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
    - SSH_OPTS="-i ${HOME}/.ssh/id_ed25519 -p ${DEPLOY_SSH_PORT} -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
    - SCP_OPTS="-i ${HOME}/.ssh/id_ed25519 -P ${DEPLOY_SSH_PORT} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
    - echo "Testing SSH connection"
    - ssh $SSH_OPTS "$DEPLOY_TARGET" "hostname && docker --version && docker info >/dev/null"
    - |
      tar \
        --exclude='.git' \
        --exclude='.gstack' \
        --exclude='.env' \
        --exclude='wild-server/.env' \
        --exclude='wild-web/.env' \
        --exclude='wild-web/node_modules' \
        --exclude='wild-web/dist' \
        --exclude='wild-server/.venv' \
        --exclude='wild-server/storage' \
        -czf /tmp/wild-agent-source.tar.gz .
    - |
      {
        printf 'CI_COMMIT_SHA=%s\n' "$CI_COMMIT_SHA"
        printf 'DEPLOY_BASE_DIR=%s\n' "$DEPLOY_BASE_DIR"
        printf 'DEPLOY_DATA_DIR=%s\n' "$DEPLOY_DATA_DIR"
        printf 'PYTHON_BASE_IMAGE=%s\n' "$PYTHON_BASE_IMAGE"
        printf 'NODE_BASE_IMAGE=%s\n' "$NODE_BASE_IMAGE"
        printf 'NGINX_BASE_IMAGE=%s\n' "$NGINX_BASE_IMAGE"
        printf 'UV_BASE_IMAGE=%s\n' "$UV_BASE_IMAGE"
      } > /tmp/wild-deploy.env
    - |
      {
        printf 'CHAT__NAME=%s\n' "$CHAT__NAME"
        printf 'CHAT__API_KEY=%s\n' "$CHAT__API_KEY"
        printf 'CHAT__BASE_URL=%s\n' "$CHAT__BASE_URL"
        printf 'EMBEDDING__NAME=%s\n' "$EMBEDDING__NAME"
        printf 'EMBEDDING__API_KEY=%s\n' "$EMBEDDING__API_KEY"
        printf 'EMBEDDING__BASE_URL=%s\n' "$EMBEDDING__BASE_URL"
      } > /tmp/wild-runtime.env
    - |
      cat > /tmp/wild-remote-deploy.sh <<'REMOTE_SCRIPT'
      #!/usr/bin/env sh
      set -eu

      DEPLOY_ENV="/tmp/wild-deploy.env"
      RUNTIME_ENV="/tmp/wild-runtime.env"
      SOURCE_ARCHIVE="/tmp/wild-agent-source.tar.gz"

      read_env() {
        grep -m 1 "^$1=" "$DEPLOY_ENV" | cut -d '=' -f 2-
      }

      CI_COMMIT_SHA="$(read_env CI_COMMIT_SHA)"
      DEPLOY_BASE_DIR="$(read_env DEPLOY_BASE_DIR)"
      DEPLOY_DATA_DIR="$(read_env DEPLOY_DATA_DIR)"
      PYTHON_BASE_IMAGE="$(read_env PYTHON_BASE_IMAGE)"
      NODE_BASE_IMAGE="$(read_env NODE_BASE_IMAGE)"
      NGINX_BASE_IMAGE="$(read_env NGINX_BASE_IMAGE)"
      UV_BASE_IMAGE="$(read_env UV_BASE_IMAGE)"

      RELEASE_DIR="${DEPLOY_BASE_DIR}/releases/${CI_COMMIT_SHA}"

      echo "Remote host: $(hostname)"
      echo "Docker version: $(docker --version)"
      echo "Deploying commit: ${CI_COMMIT_SHA}"

      if ! docker info >/dev/null 2>&1; then
        echo "ERROR - Docker daemon is not available on the remote server"
        exit 10
      fi

      mkdir -p "$RELEASE_DIR" "$DEPLOY_DATA_DIR"
      tar -xzf "$SOURCE_ARCHIVE" -C "$RELEASE_DIR"

      cd "$RELEASE_DIR"

      echo "Building wild-server image on remote server"
      docker build --pull \
        --build-arg PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE" \
        --build-arg UV_BASE_IMAGE="$UV_BASE_IMAGE" \
        -t "wild-server:${CI_COMMIT_SHA}" \
        -t "wild-server:latest" \
        -f wild-server/Dockerfile \
        wild-server

      echo "Building wild-web image on remote server"
      docker build --pull \
        --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" \
        --build-arg NGINX_BASE_IMAGE="$NGINX_BASE_IMAGE" \
        -t "wild-web:${CI_COMMIT_SHA}" \
        -t "wild-web:latest" \
        -f wild-web/Dockerfile \
        wild-web

      docker network inspect wild-net >/dev/null 2>&1 || docker network create wild-net

      docker rm -f wild-server wild-web >/dev/null 2>&1 || true

      docker run -d \
        --name wild-server \
        --restart unless-stopped \
        --network wild-net \
        -p 8000:8000 \
        -v "${DEPLOY_DATA_DIR}:/app/storage" \
        --env-file "$RUNTIME_ENV" \
        "wild-server:${CI_COMMIT_SHA}"

      docker run -d \
        --name wild-web \
        --restart unless-stopped \
        --network wild-net \
        -p 80:80 \
        "wild-web:${CI_COMMIT_SHA}"

      sleep 5

      if ! docker ps --format '{{.Names}}' | grep -qx wild-server; then
        echo "ERROR - wild-server is not running. Last logs:"
        docker logs --tail=200 wild-server || true
        exit 20
      fi

      if ! docker ps --format '{{.Names}}' | grep -qx wild-web; then
        echo "ERROR - wild-web is not running. Last logs:"
        docker logs --tail=200 wild-web || true
        exit 21
      fi

      ln -sfn "$RELEASE_DIR" "${DEPLOY_BASE_DIR}/current"

      echo "Running containers:"
      docker ps --filter "name=wild-" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

      echo "wild-server logs:"
      docker logs --tail=80 wild-server || true

      echo "wild-web logs:"
      docker logs --tail=80 wild-web || true

      rm -f "$DEPLOY_ENV" "$RUNTIME_ENV" "$SOURCE_ARCHIVE" /tmp/wild-remote-deploy.sh
      REMOTE_SCRIPT
      chmod +x /tmp/wild-remote-deploy.sh
    - scp $SCP_OPTS /tmp/wild-agent-source.tar.gz /tmp/wild-deploy.env /tmp/wild-runtime.env /tmp/wild-remote-deploy.sh "$DEPLOY_TARGET:/tmp/"
    - ssh $SSH_OPTS "$DEPLOY_TARGET" "sh /tmp/wild-remote-deploy.sh"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
