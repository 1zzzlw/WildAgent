# ============================================================
# 全局 before_script，会在各阶段 script 之前运行
# 如果某个 job 里定义了 before_script，则以 job 里的为准
# ============================================================
before_script:
  # 定义唯一的 Docker 镜像标签，每次提交构建的镜像都是唯一的
  - export IMAGE_SERVER_NAME=${CI_REGISTRY_IMAGE}/wild-server:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}
  - export IMAGE_WEB_NAME=${CI_REGISTRY_IMAGE}/wild-web:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}
  - export IMAGE_SERVER_LATEST=${CI_REGISTRY_IMAGE}/wild-server:latest
  - export IMAGE_WEB_LATEST=${CI_REGISTRY_IMAGE}/wild-web:latest

# ============================================================
# 定义 CI 阶段执行顺序
# ============================================================
stages:
  - validate    # 第1步：验证代码能否正常编译
  - build       # 第2步：构建 Docker 镜像并推送到仓库
  - deploy      # 第3步：在远程服务器上拉取镜像并运行

# ============================================================
# 全局变量
# ============================================================
variables:
  PROJECT: "wild-agent"
  # Docker-in-Docker 需要的配置
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

# ============================================================
# Stage 1: 验证代码（仿照样例中的 compile 阶段）
# ============================================================
前端编译检查:
  image: node:22-alpine
  stage: validate
  allow_failure: false
  only:
    - main
    - master
  before_script:
    - cd wild-web
  script:
    - npm ci
    - npm run build
  # 构建产物，供后续阶段使用（类似于 Maven 的 target/*.jar）
  artifacts:
    name: "$PROJECT-web-dist"
    expire_in: 1 day
    paths:
      - wild-web/dist/

后端语法检查:
  image: python:3.12-slim
  stage: validate
  allow_failure: false
  only:
    - main
    - master
  before_script:
    - cd wild-server
    - pip install uv
  script:
    # 检查 Python 语法是否正确，依赖是否能解析
    - python -m compileall app/
    - python -c "import ast; ast.parse(open('main.py').read()); print('main.py OK')"
    - uv lock --check 2>/dev/null || echo "uv.lock 不是最新的，但不阻塞 CI"

# ============================================================
# Stage 2: 构建镜像并推送（仿照样例中的 build 阶段）
# ============================================================
构建后端镜像:
  image: docker:stable
  stage: build
  services:
    - docker:dind
  only:
    - main
    - master
  script:
    # 登录 GitLab Container Registry
    - docker login --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # 构建 wild-server 镜像
    - docker build
      --build-arg PYTHON_BASE_IMAGE=${PYTHON_BASE_IMAGE:-python:3.12-slim}
      --build-arg UV_BASE_IMAGE=${UV_BASE_IMAGE:-ghcr.io/astral-sh/uv:latest}
      -t $IMAGE_SERVER_NAME
      -t $IMAGE_SERVER_LATEST
      -f wild-server/Dockerfile
      wild-server
    # 推送到仓库
    - docker push $IMAGE_SERVER_NAME
    - docker push $IMAGE_SERVER_LATEST
    # 清理
    - docker rmi $IMAGE_SERVER_NAME $IMAGE_SERVER_LATEST || true

构建前端镜像:
  image: docker:stable
  stage: build
  services:
    - docker:dind
  only:
    - main
    - master
  script:
    - docker login --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # 构建 wild-web 镜像
    - docker build
      --build-arg NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-node:22-alpine}
      --build-arg NGINX_BASE_IMAGE=${NGINX_BASE_IMAGE:-nginx:alpine}
      -t $IMAGE_WEB_NAME
      -t $IMAGE_WEB_LATEST
      -f wild-web/Dockerfile
      wild-web
    # 推送到仓库
    - docker push $IMAGE_WEB_NAME
    - docker push $IMAGE_WEB_LATEST
    # 清理
    - docker rmi $IMAGE_WEB_NAME $IMAGE_WEB_LATEST || true

# ============================================================
# Stage 3: 部署到远程服务器（仿照样例中的 run 阶段）
# ============================================================
部署到生产:
  image: alpine:3.20
  stage: deploy
  resource_group: production   # 防止多个 pipeline 同时部署
  only:
    - main
    - master
  variables:
    DEPLOY_SSH_USER: "root"
    DEPLOY_SSH_HOST: "39.106.183.13"
    DEPLOY_SSH_PORT: "22"
    DEPLOY_DATA_DIR: "/opt/wild-agent/storage"
  before_script:
    # 安装 SSH 客户端
    - apk add --no-cache openssh-client
    # 检查必要变量
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "ERROR: 请在 GitLab CI/CD 变量中设置 SSH_PRIVATE_KEY"
        exit 1
      fi
    # 配置 SSH 密钥
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p $DEPLOY_SSH_PORT -H $DEPLOY_SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - DEPLOY_TARGET="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
    - SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p $DEPLOY_SSH_PORT"
    - |
      echo "=== 测试 SSH 连接 ==="
      ssh $SSH_OPTS "$DEPLOY_TARGET" "hostname && docker --version"
    - |
      echo "=== 登录远程 Docker Registry ==="
      ssh $SSH_OPTS "$DEPLOY_TARGET" "
        docker login --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD $CI_REGISTRY
      "
    - |
      echo "=== 拉取最新镜像 ==="
      ssh $SSH_OPTS "$DEPLOY_TARGET" "
        docker pull $IMAGE_SERVER_NAME && docker pull $IMAGE_WEB_NAME
      "
    - |
      echo "=== 重建容器 ==="
      ssh $SSH_OPTS "$DEPLOY_TARGET" "
        # 确保网络存在
        docker network inspect wild-net >/dev/null 2>&1 || docker network create wild-net

        # 停止并删除旧容器
        docker rm -f wild-server wild-web 2>/dev/null || true

        # 确保数据目录存在
        mkdir -p $DEPLOY_DATA_DIR

        # 启动后端
        docker run -d \
          --name wild-server \
          --restart unless-stopped \
          --network wild-net \
          -p 8000:8000 \
          -v ${DEPLOY_DATA_DIR}:/app/storage \
          $IMAGE_SERVER_NAME

        # 启动前端
        docker run -d \
          --name wild-web \
          --restart unless-stopped \
          --network wild-net \
          -p 80:80 \
          $IMAGE_WEB_NAME
      "
    - |
      echo "=== 等待容器启动 ==="
      sleep 5
    - |
      echo "=== 检查容器状态 ==="
      ssh $SSH_OPTS "$DEPLOY_TARGET" "
        echo '--- 运行中的 wild 容器 ---'
        docker ps --filter 'name=wild-' --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

        echo ''
        echo '--- wild-server 最近日志 ---'
        docker logs --tail=30 wild-server 2>&1 || echo '(容器未运行)'

        echo ''
        echo '--- wild-web 最近日志 ---'
        docker logs --tail=30 wild-web 2>&1 || echo '(容器未运行)'

        echo ''
        if docker ps --format '{{.Names}}' | grep -qx wild-server; then
          echo '✅ wild-server 运行正常'
        else
          echo '❌ wild-server 未运行！'
          exit 1
        fi

        if docker ps --format '{{.Names}}' | grep -qx wild-web; then
          echo '✅ wild-web 运行正常'
        else
          echo '❌ wild-web 未运行！'
          exit 1
        fi
      "
    - echo "✅ 部署完成！"
