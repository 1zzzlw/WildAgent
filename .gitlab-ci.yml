stages:
  - build
  - deploy

variables:
  SERVER_IMAGE: $CI_REGISTRY_IMAGE/wild-server
  WEB_IMAGE: $CI_REGISTRY_IMAGE/wild-web

# ==================== 构建后端 wild-server ====================

build-server:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $SERVER_IMAGE:$CI_COMMIT_SHA -t $SERVER_IMAGE:latest -f wild-server/Dockerfile wild-server/
    - docker push $SERVER_IMAGE:$CI_COMMIT_SHA
    - docker push $SERVER_IMAGE:latest
  rules:
    - changes:
        - wild-server/**/*

# ==================== 构建前端 wild-web ====================

build-web:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $WEB_IMAGE:$CI_COMMIT_SHA -t $WEB_IMAGE:latest -f wild-web/Dockerfile wild-web/
    - docker push $WEB_IMAGE:$CI_COMMIT_SHA
    - docker push $WEB_IMAGE:latest
  rules:
    - changes:
        - wild-web/**/*

# ==================== 部署 ====================

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - echo "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' > /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
  script:
    - ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no root@39.106.183.13 <<-EOF
        set -e
        docker login --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker pull $SERVER_IMAGE:latest
        docker pull $WEB_IMAGE:latest
        docker rm -f wild-server wild-web 2>/dev/null || true

        docker run -d --name wild-server --restart unless-stopped -p 8000:8000 \
          -e CHAT__NAME="$CHAT__NAME" \
          -e CHAT__API_KEY="$CHAT__API_KEY" \
          -e CHAT__BASE_URL="$CHAT__BASE_URL" \
          -e EMBEDDING__NAME="$EMBEDDING__NAME" \
          -e EMBEDDING__API_KEY="$EMBEDDING__API_KEY" \
          -e EMBEDDING__BASE_URL="$EMBEDDING__BASE_URL" \
          $SERVER_IMAGE:latest

        docker run -d --name wild-web --restart unless-stopped -p 80:80 $WEB_IMAGE:latest
      EOF
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
